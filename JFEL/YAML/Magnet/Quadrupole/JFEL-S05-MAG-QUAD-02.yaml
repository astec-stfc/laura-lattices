name: JFEL-S05-MAG-QUAD-02
machine_area: S05
controls:
  variables:
    SETI:
      identifier: JFEL-S05-MAG-QUAD-02:SETI
      dtype: float
      protocol: CA
      description: Sets the target current for a magnet power supply.
      units: A
      read_only: false
      type: scalar
      readback: READI
      dynamics:
        model: laura.utils.dynamics.FirstOrderResponse
        tau: 0.2
    READI:
      identifier: JFEL-S05-MAG-QUAD-02:READI
      dtype: float
      protocol: CA
      description: Gets the readback current of a magnet power supply.
      units: A
      read_only: true
      type: scalar
      update:
        function: laura.utils.signals.RandomWalk
        noise: 0.001
    READK:
      identifier: JFEL-S05-MAG-QUAD-02:CalcK
      dtype: float
      protocol: CA
      description: Reads the calculated K value for a magnet based on momentum of
        the section
      read_only: false
      type: scalar
physical:
  middle:
    z: 25.484268
  length: 0.162
magnetic:
  length: 0.162
  multipoles:
    K0L: {}
    K1L:
      order: 1
      normal: 0.209366
    K2L:
      order: 2
    K3L:
      order: 3
    K4L:
      order: 4
  order: 1
hardware_type: Quadrupole
hardware_class: Magnet
