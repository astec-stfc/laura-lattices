name: JFEL-S07-MAG-QUAD-11
machine_area: S07
controls:
  variables:
    SETI:
      identifier: JFEL-S07-MAG-QUAD-11:SETI
      dtype: float
      protocol: CA
      description: Sets the target current for a magnet power supply.
      units: A
      read_only: false
      type: scalar
      readback: READI
      dynamics:
        model: laura.utils.dynamics.FirstOrderResponse
        tau: 0.2
    READI:
      identifier: JFEL-S07-MAG-QUAD-11:READI
      dtype: float
      protocol: CA
      description: Gets the readback current of a magnet power supply.
      units: A
      read_only: true
      type: scalar
      update:
        function: laura.utils.signals.RandomWalk
        noise: 0.001
    READK:
      identifier: JFEL-S07-MAG-QUAD-11:CalcK
      dtype: float
      protocol: CA
      description: Reads the calculated K value for a magnet based on momentum of
        the section
      read_only: false
      type: scalar
physical:
  middle:
    z: 48.6668
  length: 0.162
magnetic:
  length: 0.162
  order: 1
hardware_type: Quadrupole
hardware_class: Magnet
