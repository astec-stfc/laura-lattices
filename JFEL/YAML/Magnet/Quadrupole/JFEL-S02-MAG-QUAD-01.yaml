name: JFEL-S02-MAG-QUAD-01
machine_area: S02
controls:
  variables:
    SETI:
      identifier: JFEL-S02-MAG-QUAD-01:SETI
      dtype: float
      protocol: CA
      description: Sets the target current for a magnet power supply.
      units: A
      read_only: false
      type: scalar
      readback: READI
      dynamics:
        model: laura.utils.dynamics.FirstOrderResponse
        tau: 0.2
    READI:
      identifier: JFEL-S02-MAG-QUAD-01:READI
      dtype: float
      protocol: CA
      description: Gets the readback current of a magnet power supply.
      units: A
      read_only: true
      type: scalar
      update:
        function: laura.utils.signals.RandomWalk
        noise: 0.001
    READK:
      identifier: JFEL-S02-MAG-QUAD-01:CalcK
      dtype: float
      protocol: CA
      description: Reads the calculated K value for a magnet based on momentum of
        the section
      read_only: false
      type: scalar
physical:
  middle:
    z: 3.52715239
  length: 0.12868478212775
magnetic:
  length: 0.12868478212775
  multipoles:
    K0L: {}
    K1L:
      order: 1
      normal: 1.3
    K2L:
      order: 2
    K3L:
      order: 3
    K4L:
      order: 4
  order: 1
hardware_type: Quadrupole
hardware_class: Magnet
