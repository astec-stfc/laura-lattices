# Staging, stage 1: Wake-T's tutorial 02 LPA. An a0 = 3, 40 um-waist, 30 fs
# laser, focused at the middle of a uniform 2 cm plasma at 1e23 m^-3,
# accelerates the 30 pC, 100 MeV witness (Data_Files/lwfa_witness) 60 um
# behind it. Reference (Wake-T directly): gamma 195.7 -> 577.1, 1.24% spread,
# eps_nx 1.14 um.
#
# Box positions are relative to the witness centroid.
name: PLA-STG-PLASMA-01
hardware_class: Plasma
hardware_type: Plasma
hardware_model: Plasma
machine_area: STG
physical:
  middle:
    z: 4.01
  length: 0.02
plasma:
  density: 1.0e+23
  density_profile: false
laser:
  role: driver
  profile_type: gaussian
  a0: 3.0
  wavelength: 800.0e-9
  waist: 40.0e-6
  pulse_duration_fwhm: 30.0e-15
  initial_position: 60.0e-6
  focal_position: 0.01      # middle of the stage
simulation:
  wakefield_model: quasistatic_2d
  n_out: 10
  min_longitudinal_position: -40.0e-6
  max_longitudinal_position: 90.0e-6
  n_longitudinal: 260
  n_radial: 200
  r_max: 200.0e-6
  particles_per_radial_cell: 4
